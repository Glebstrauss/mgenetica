format:
  html:
    theme:
      light:
      - cosmo
      - styles/main.scss
      dark:
      - slate
      - styles/main.scss
      - styles/main-dark.scss
    include-in-header: assets/html/head-extras.html
    include-after-body: assets/html/body-extras.html
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: true
    smooth-scroll: true
    link-external-newwindow: true
    lang: pt-BR
execute:
  eval: false
  warning: false
  message: false
  echo: true
