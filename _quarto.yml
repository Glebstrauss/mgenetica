project:
  type: website
  output-dir: docs
  render:
  - '*.qmd'
  - modules/*.qmd
  - semanas/*.qmd
  resources:
  - assets/
  - data/modulo*_simulado.csv
  - data/course-structure-redesign.yml
  - data/course-content.yml
  - data/course-content-expansion.yml
  - data/course-practice.yml
  - data/glossary.yml
  - data/site-manifest.yml
  - images/
  - quizzes/
  - scripts/modulo*.R
website:
  title: MGenética
  site-url: https://mgenetica.github.io/
  repo-url: https://github.com/Mgenetica/mgenetica
  repo-actions: []
  description: Curso aberto de melhoramento genético animal para graduação, com 5
    módulos, 21 blocos temáticos, itens de estudo e laboratórios R.
  favicon: images/favicon/favicon.ico
  open-graph:
    title: MGenética Academy
    description: 'Melhoramento genético animal para graduação: genética básica, populações,
      quantitativa, avaliação e genômica com R.'
    image: https://mgenetica.github.io/images/og-card.png
    locale: pt_BR
  twitter-card:
    card-style: summary_large_image
    title: MGenética Academy
    description: 'Melhoramento genético animal para graduação: genética básica, populações,
      quantitativa, avaliação e genômica com R.'
    image: https://mgenetica.github.io/images/og-card.png
  navbar:
    logo: images/mgenetica-logo-correct.png
    logo-alt: Logo MGenética
    left:
    - href: index.qmd
      text: Início
    - href: modules/index.qmd
      text: Curso
    - href: busca.qmd
      text: Busca
    - href: avaliacao.qmd
      text: Avaliação
    - href: certificado.qmd
      text: Certificado
    - href: perfil.qmd
      text: Sobre
    right:
    - href: modules/modulo01-revis-ao-de-gen-etica-b-asica.qmd
      text: Começar curso
  page-footer:
    left: MGenética · estudar, consultar, concluir
    center:
    - href: index.qmd
      text: Início
    - href: modules/index.qmd
      text: Curso
    - href: busca.qmd
      text: Busca
    - href: avaliacao.qmd
      text: Avaliação
    - href: certificado.qmd
      text: Certificado
    - href: perfil.qmd
      text: Sobre
    - href: https://github.com/Mgenetica/mgenetica/issues/new
      text: Feedback
    right:
    - href: https://github.com/Mgenetica/mgenetica
      text: GitHub
  sidebar:
    style: docked
    search: true
    contents:
    - section: Curso
      contents:
      - modules/index.qmd
      - modules/modulo01-revis-ao-de-gen-etica-b-asica.qmd
      - modules/modulo02-modos-de-ac-ao-g-enica.qmd
      - modules/modulo03-gen-etica-de-populac-oes-i-frequ-encias-al-elicas-e-genot-ipicas.qmd
      - modules/modulo04-hardy-weinberg-alelos-m-ultiplos-e-genes-ligados-ao-sexo.qmd
      - modules/modulo05-fatores-que-alteram-frequ-encias-g-enicas.qmd
      - modules/modulo06-valores-e-m-edias-fen-otipo-gen-otipo-e-ambiente.qmd
      - modules/modulo07-noc-oes-de-gen-etica-quantitativa.qmd
      - modules/modulo08-componentes-de-vari-ancia.qmd
      - modules/modulo09-herdabilidade-e-repetibilidade.qmd
      - modules/modulo10-selec-ao-e-ganho-gen-etico.qmd
      - modules/modulo11-correlac-oes-gen-eticas-fenot-ipicas-e-ambientais.qmd
      - modules/modulo12-caracter-isticas-de-limiar.qmd
      - modules/modulo13-endogamia-e-parentesco.qmd
      - modules/modulo14-cruzamentos-heterose-e-complementaridade.qmd
      - modules/modulo15-avaliac-ao-gen-etica-dep-ebv-e-ranking-de-animais.qmd
      - modules/modulo16-modelos-lineares-e-modelos-mistos.qmd
      - modules/modulo17-blup-e-modelo-animal.qmd
      - modules/modulo18-gen-omica-marcadores-snp-e-dados-moleculares.qmd
      - modules/modulo19-controle-de-qualidade-de-dados-gen-omicos.qmd
      - modules/modulo20-matrizes-gen-omicas-gwas-e-predic-ao-gen-omica.qmd
      - modules/modulo21-projeto-final-pipeline-completo-de-selec-ao.qmd
format:
  html:
    theme:
      light:
      - cosmo
      - styles/main.scss
      dark:
      - slate
      - styles/main.scss
      - styles/main-dark.scss
    include-in-header: assets/html/head-extras.html
    include-after-body: assets/html/body-extras.html
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: true
    smooth-scroll: true
    link-external-newwindow: true
    lang: pt-BR
execute:
  warning: false
  message: false
  echo: true
