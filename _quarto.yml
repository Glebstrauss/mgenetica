project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "modules/*.qmd"
    - "semanas/*.qmd"
  resources:
    - "assets/"
    - "data/site-manifest.yml"
    - "images/"
    - "quizzes/"

website:
  title: "MGenética"
  site-url: "https://glebstrauss.github.io/mgenetica/"
  repo-url: "https://github.com/Glebstrauss/mgenetica"
  repo-actions: []
  description: "Curso aberto de melhoramento animal, genética quantitativa e genômica aplicada com R. 12 módulos progressivos, scripts reproduzíveis e dados simulados."
  favicon: images/favicon/favicon.ico
  open-graph:
    title: "MGenética Academy"
    description: "Melhoramento animal, do conceito ao código. 12 módulos progressivos com R."
    image: https://glebstrauss.github.io/mgenetica/images/og-card.png
    locale: pt_BR
  twitter-card:
    card-style: summary_large_image
    title: "MGenética Academy"
    description: "Melhoramento animal, do conceito ao código. 12 módulos progressivos com R."
    image: https://glebstrauss.github.io/mgenetica/images/og-card.png
  navbar:
    logo: images/mgenetica-logo-correct.png
    logo-alt: "Logo MGenética"
    left:
      - href: index.qmd
        text: Início
      - href: modules/index.qmd
        text: Módulos
      - href: semanas/index.qmd
        text: Roteiro
      - href: busca.qmd
        text: Busca
      - href: glossario.qmd
        text: Glossário
      - href: certificado.qmd
        text: Certificado
      - href: perfil.qmd
        text: Sobre
    right:
      - href: modules/modulo01-introducao-ao-melhoramento-animal.qmd
        text: Começar M01
  page-footer:
    left: "MGenética · estudar, consultar, concluir"
    center:
      - href: index.qmd
        text: Início
      - href: modules/index.qmd
        text: Módulos
      - href: semanas/index.qmd
        text: Roteiro
      - href: busca.qmd
        text: Busca
      - href: glossario.qmd
        text: Glossário
      - href: certificado.qmd
        text: Certificado
      - href: perfil.qmd
        text: Sobre
      - href: https://github.com/Glebstrauss/mgenetica/issues/new
        text: Feedback
    right:
      - href: https://github.com/Glebstrauss/mgenetica
        text: GitHub
  sidebar:
    style: "docked"
    search: true
    contents:
      - section: "Módulos"
        contents:
          - modules/index.qmd
          - modules/modulo01-introducao-ao-melhoramento-animal.qmd
          - modules/modulo02-bases-da-genetica-quantitativa.qmd
          - modules/modulo03-estatistica-descritiva-e-exploracao-de-dados-no-r.qmd
          - modules/modulo04-medias-variancias-e-componentes-de-variancia.qmd
          - modules/modulo05-herdabilidade-e-repetibilidade.qmd
          - modules/modulo06-correlacoes-geneticas-e-fenotipicas.qmd
          - modules/modulo07-modelos-lineares-e-modelos-mistos.qmd
          - modules/modulo08-blup-e-avaliacao-genetica.qmd
          - modules/modulo09-estrutura-de-pedigree-e-parentesco.qmd
          - modules/modulo10-introducao-a-genomica-e-marcadores-snp.qmd
          - modules/modulo11-controle-de-qualidade-de-dados-genomicos.qmd
          - modules/modulo12-matrizes-genomicas-gwas-e-predicao-genomica.qmd

format:
  html:
    theme:
      light: [cosmo, styles/main.scss]
      dark:  [slate,  styles/main.scss, styles/main-dark.scss]
    include-in-header: assets/html/head-extras.html
    include-after-body: assets/html/body-extras.html
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: true
    smooth-scroll: true
    link-external-newwindow: true
    lang: pt-BR

execute:
  warning: false
  message: false
  echo: true
