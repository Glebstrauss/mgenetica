<script>
// ── Carrega scripts globais (compatível com subpath do GH Pages) ──
(function () {
  var pageDir  = window.location.pathname.endsWith('/')
    ? window.location.pathname
    : window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/'));
  var inSubdir = ['modules', 'semanas'].some(function (d) {
    return pageDir.indexOf('/' + d) >= 0;
  });
  var prefix = inSubdir ? '../' : '';

  function load(files) {
    if (files.length === 0) return;
    var file = files.shift();
    var s = document.createElement('script');
    s.src = prefix + 'assets/js/' + file;
    s.onload = function () { load(files); };
    document.body.appendChild(s);
  }

  var files = ['progress.js', 'darkmode.js'];
  var isModulePage = /\/modules\//.test(window.location.pathname);

  if (isModulePage) files.push('teacher-mode.js');
  if (document.querySelector('[data-viz], [data-learning-map], .mg-viz')) files.push('interactives.js');
  if (document.querySelector('.quiz-container')) files.push('quiz.js');

  load(files);
})();
</script>
