<script>
// ── Carrega scripts globais (compatível com subpath do GH Pages) ──
(function () {
  function stripFileSegment(path) {
    var clean = path || '/';
    if (!clean.endsWith('/')) {
      var last = clean.substring(clean.lastIndexOf('/') + 1);
      if (last.indexOf('.') >= 0) clean = clean.substring(0, clean.lastIndexOf('/')) || '/';
    }
    return clean;
  }

  function getPrefixFromDepth(pathname) {
    var dir = stripFileSegment(pathname).replace(/^\/+|\/+$/g, '');
    if (!dir) return '';
    var depth = dir.split('/').length;
    return '../'.repeat(depth);
  }

  var prefix = getPrefixFromDepth(window.location.pathname);
  window.mgeneticaAssetPrefix = prefix;

  function load(files) {
    if (files.length === 0) return;
    var file = files.shift();
    var s = document.createElement('script');
    s.src = prefix + 'assets/js/' + file;
    s.defer = true;
    s.onload = function () { load(files); };
    document.body.appendChild(s);
  }

  var files = ['i18n.js', 'progress.js', 'darkmode.js'];
  var hasQuiz = document.querySelector('.quiz-container');

  if (document.querySelector('[data-viz], [data-learning-map], [data-glossary], .mg-viz')) files.push('interactives.js');
  if (hasQuiz) files.push('teacher-mode.js', 'quiz.js');

  load(files);
})();
</script>
