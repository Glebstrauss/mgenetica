<!-- Manrope + Inter + JetBrains Mono via Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">

<!-- Favicon -->
<link rel="icon" href="https://mgenetica.github.io/images/favicon/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="https://mgenetica.github.io/images/favicon/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="https://mgenetica.github.io/images/favicon/favicon-16.png">
<link rel="apple-touch-icon" href="https://mgenetica.github.io/images/favicon/apple-touch-icon.png">
<link rel="manifest" href="https://mgenetica.github.io/images/favicon/site.webmanifest">

<!-- PWA theme color -->
<meta name="theme-color" content="#0d2642" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161b22" media="(prefers-color-scheme: dark)">

<script>
  // Ensure skip-link is the first focusable element in <body> (even if injected late).
  document.addEventListener("DOMContentLoaded", function () {
    var main = document.getElementById("quarto-document-content");
    if (main && !main.hasAttribute("tabindex")) main.setAttribute("tabindex", "-1");

    var link = document.querySelector(".skip-link");
    if (!link) {
      link = document.createElement("a");
      link.className = "skip-link";
      link.href = "#quarto-document-content";
      link.textContent = "Pular para o conteúdo";
      document.body.appendChild(link);
    }

    if (!link.dataset.skipLinkBound) {
      link.addEventListener("click", function () {
        var target = document.getElementById("quarto-document-content");
        if (target) target.focus();
      });
      link.dataset.skipLinkBound = "1";
    }

    document.body.insertBefore(link, document.body.firstChild);

    function quietAnchorLinks() {
      document.querySelectorAll(".anchorjs-link").forEach(function (anchor) {
        anchor.setAttribute("tabindex", "-1");
        anchor.setAttribute("aria-hidden", "true");
      });
    }

    quietAnchorLinks();
    window.setTimeout(quietAnchorLinks, 600);
    new MutationObserver(quietAnchorLinks).observe(document.body, {
      childList: true,
      subtree: true
    });
  });
</script>
