<!-- MGenética brand type is declared in CSS with system fallbacks to avoid render-blocking external font requests. -->

<!-- Favicon -->
<link rel="icon" href="https://mgenetica.github.io/mgenetica/images/favicon/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="https://mgenetica.github.io/mgenetica/images/favicon/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="https://mgenetica.github.io/mgenetica/images/favicon/favicon-16.png">
<link rel="apple-touch-icon" href="https://mgenetica.github.io/mgenetica/images/favicon/apple-touch-icon.png">
<link rel="manifest" href="https://mgenetica.github.io/mgenetica/images/favicon/site.webmanifest">

<!-- PWA theme color -->
<meta name="theme-color" content="#0d2642" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161b22" media="(prefers-color-scheme: dark)">

<script>
  // Ensure skip-link is the first focusable element in <body> (even if injected late).
  document.addEventListener("DOMContentLoaded", function () {
    var main = document.getElementById("quarto-document-content");
    if (main && !main.hasAttribute("tabindex")) main.setAttribute("tabindex", "-1");

    var link = document.querySelector(".skip-link");
    if (!link) {
      link = document.createElement("a");
      link.className = "skip-link";
      link.href = "#quarto-document-content";
      link.setAttribute("data-i18n", "skip.content");
      link.textContent = "Pular para o conteúdo";
      document.body.appendChild(link);
    }

    if (!link.dataset.skipLinkBound) {
      link.addEventListener("click", function () {
        var target = document.getElementById("quarto-document-content");
        if (target) target.focus();
      });
      link.dataset.skipLinkBound = "1";
    }

    document.body.insertBefore(link, document.body.firstChild);

    function quietAnchorLinks() {
      document.querySelectorAll(".anchorjs-link").forEach(function (anchor) {
        anchor.setAttribute("tabindex", "-1");
        anchor.setAttribute("aria-hidden", "true");
      });
    }

    quietAnchorLinks();
    window.setTimeout(quietAnchorLinks, 600);
    new MutationObserver(quietAnchorLinks).observe(document.body, {
      childList: true,
      subtree: true
    });
  });
</script>

<script>
  (function () {
    var origin = "https://mgenetica.github.io";
    var projectBase = "/mgenetica";
    var specialRoutes = [
      { test: /^\/$|^\/index\.(html|qmd)$/i, paths: { "pt-BR": "/", en: "/en/", es: "/es/" } },
      { test: /^\/modules(\/index\.(html|qmd))?\/?$/i, paths: { "pt-BR": "/modules/", en: "/en/modules/", es: "/es/modules/" } },
      { test: /^\/semanas(\/index\.(html|qmd))?\/?$/i, paths: { "pt-BR": "/semanas/", en: "/en/semanas/", es: "/es/semanas/" } },
      { test: /^\/busca\.(html|qmd)$/i, paths: { "pt-BR": "/busca.html", en: "/en/search.html", es: "/es/busqueda.html" } },
      { test: /^\/glossario\.(html|qmd)$/i, paths: { "pt-BR": "/glossario.html", en: "/en/glossary.html", es: "/es/glosario.html" } },
      { test: /^\/perfil\.(html|qmd)$/i, paths: { "pt-BR": "/perfil.html", en: "/en/about.html", es: "/es/sobre.html" } },
      { test: /^\/certificado\.(html|qmd)$/i, paths: { "pt-BR": "/certificado.html", en: "/en/certificate.html", es: "/es/certificado.html" } }
    ];

    function normalizePath(pathname) {
      var path = String(pathname || "/").split("?")[0].split("#")[0];
      path = path.replace(/\/index\.html$/i, "/").replace(/\/index\.qmd$/i, "/");
      if (!path.startsWith("/")) path = "/" + path;
      if (path.length > 1 && path.endsWith("/")) path = path.slice(0, -1);
      if (path === "/en" || path === "/es") path += "/";
      return path || "/";
    }

    function stripLocalePrefix(path) {
      var normalized = normalizePath(path);
      if (normalized === projectBase || normalized.indexOf(projectBase + "/") === 0) {
        normalized = normalized.slice(projectBase.length) || "/";
        normalized = normalizePath(normalized);
      }
      if (normalized === "/en" || normalized === "/en/" || normalized === "/es" || normalized === "/es/") return "/";
      return normalized.replace(/^\/(en|es)(?=\/)/i, "");
    }

    function withBase(path) {
      if (window.location.pathname === projectBase || window.location.pathname.indexOf(projectBase + "/") === 0) {
        if (path === "/") return projectBase + "/";
        return projectBase + path;
      }
      return path;
    }

    function mapPathToLocale(pathname, locale) {
      var path = stripLocalePrefix(pathname);
      for (var i = 0; i < specialRoutes.length; i++) {
        if (specialRoutes[i].test.test(path)) {
          return withBase(specialRoutes[i].paths[locale]);
        }
      }
      var moduleMatch = path.match(/^\/modules\/(modulo[0-9]{2}[^/]*\.(html|qmd))$/i);
      if (moduleMatch) {
        var prefix = locale === "pt-BR" ? "" : "/" + locale;
        return withBase(prefix + "/modules/" + moduleMatch[1]);
      }
      return null;
    }

    function setLink(rel, href, hreflang) {
      var selector = hreflang ? 'link[rel="' + rel + '"][hreflang="' + hreflang + '"]' : 'link[rel="' + rel + '"]';
      var existing = document.head.querySelector(selector);
      var node = existing || document.createElement("link");
      node.setAttribute("rel", rel);
      node.setAttribute("href", href);
      if (hreflang) node.setAttribute("hreflang", hreflang);
      if (!existing) document.head.appendChild(node);
    }

    var canonicalPath = mapPathToLocale(window.location.pathname, "pt-BR");
    var enPath = mapPathToLocale(window.location.pathname, "en");
    var esPath = mapPathToLocale(window.location.pathname, "es");
    if (!canonicalPath || !enPath || !esPath) return;
    setLink("canonical", origin + canonicalPath);

    setLink("alternate", origin + canonicalPath, "pt-BR");
    setLink("alternate", origin + enPath, "en");
    setLink("alternate", origin + esPath, "es");
    setLink("alternate", origin + canonicalPath, "x-default");
  })();
</script>
