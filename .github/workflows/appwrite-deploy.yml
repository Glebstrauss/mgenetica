name: Appwrite Functions deploy

on:
  workflow_dispatch:
  push:
    paths:
      - 'appwrite/functions/**'
      - 'appwrite/functions.json'
      - 'appwrite/appwrite.config.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      - name: Check Appwrite deploy secrets
        run: |
          if [ -z "${{ secrets.APPWRITE_API_KEY }}" ] || [ -z "${{ secrets.APPWRITE_PROJECT_ID }}" ]; then
            echo "::error::Missing Appwrite deploy secrets. Set APPWRITE_API_KEY and APPWRITE_PROJECT_ID before expecting cloud function deploys.";
            exit 1;
          fi
      - name: Install Appwrite CLI
        run: npm install -g appwrite-cli
      - name: Configure Appwrite client
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          appwrite client \
            --endpoint "${{ vars.APPWRITE_ENDPOINT || 'https://fra.cloud.appwrite.io/v1' }}" \
            --project-id "${{ secrets.APPWRITE_PROJECT_ID }}" \
            --key "$APPWRITE_API_KEY"
      - name: Push functions
        working-directory: appwrite
        run: appwrite push functions --all --force --activate true
