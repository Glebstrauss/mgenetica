name: Appwrite Functions deploy

on:
  workflow_dispatch:
  push:
    paths:
      - 'appwrite/functions/**'
      - 'appwrite/functions.json'
      - 'appwrite/appwrite.config.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      - name: Check Appwrite deploy secrets
        run: |
          if [ -z "${{ secrets.APPWRITE_API_KEY }}" ] || [ -z "${{ secrets.APPWRITE_PROJECT_ID }}" ]; then
            echo "::error::Missing Appwrite deploy secrets. Set APPWRITE_API_KEY and APPWRITE_PROJECT_ID before expecting cloud function deploys.";
            exit 1;
          fi
      - name: Install Appwrite CLI
        run: npm install -g appwrite-cli
      - name: Configure Appwrite client
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          appwrite client \
            --endpoint "${{ vars.APPWRITE_ENDPOINT || 'https://fra.cloud.appwrite.io/v1' }}" \
            --project-id "${{ secrets.APPWRITE_PROJECT_ID }}" \
            --key "$APPWRITE_API_KEY"
      - name: Push functions
        working-directory: appwrite
        run: appwrite push functions --all --force --activate true
      - name: Sync function metadata
        env:
          APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT || 'https://fra.cloud.appwrite.io/v1' }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          node <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const endpoint = process.env.APPWRITE_ENDPOINT;
          const projectId = process.env.APPWRITE_PROJECT_ID;
          const apiKey = process.env.APPWRITE_API_KEY;
          const functionsPath = path.join(process.cwd(), 'appwrite', 'functions.json');
          const functions = JSON.parse(fs.readFileSync(functionsPath, 'utf8'));

          async function request(pathname, { method = 'GET', body } = {}) {
            const response = await fetch(`${endpoint}${pathname}`, {
              method,
              headers: {
                'Content-Type': 'application/json',
                'X-Appwrite-Project': projectId,
                'X-Appwrite-Key': apiKey
              },
              body: body ? JSON.stringify(body) : undefined
            });
            const text = await response.text();
            let data = {};
            if (text) {
              try {
                data = JSON.parse(text);
              } catch {
                data = { message: text };
              }
            }
            if (!response.ok) {
              throw new Error(`${method} ${pathname} failed: ${data.message || response.status}`);
            }
            return data;
          }

          for (const fn of functions) {
            await request(`/functions/${fn.$id}`, {
              method: 'PUT',
              body: {
                name: fn.name,
                runtime: fn.runtime,
                execute: fn.execute || [],
                events: fn.events || [],
                schedule: fn.schedule || '',
                timeout: fn.timeout,
                enabled: fn.enabled,
                logging: fn.logging,
                entrypoint: fn.entrypoint,
                commands: fn.commands || '',
                scopes: fn.scopes || []
              }
            });
          }
          NODE
      - name: Sync function runtime variables
        env:
          APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT || 'https://fra.cloud.appwrite.io/v1' }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS || vars.VITE_ADMIN_EMAILS || '' }}
        run: |
          node <<'NODE'
          const endpoint = process.env.APPWRITE_ENDPOINT;
          const projectId = process.env.APPWRITE_PROJECT_ID;
          const apiKey = process.env.APPWRITE_API_KEY;
          const adminEmails = process.env.ADMIN_EMAILS || '';

          async function request(path, { method = 'GET', body } = {}) {
            const response = await fetch(`${endpoint}${path}`, {
              method,
              headers: {
                'Content-Type': 'application/json',
                'X-Appwrite-Project': projectId,
                'X-Appwrite-Key': apiKey
              },
              body: body ? JSON.stringify(body) : undefined
            });
            const text = await response.text();
            let data = {};
            if (text) {
              try {
                data = JSON.parse(text);
              } catch {
                data = { message: text };
              }
            }
            if (!response.ok) {
              throw new Error(`${method} ${path} failed: ${data.message || response.status}`);
            }
            return data;
          }

          async function listVariables(functionId) {
            const payload = await request(`/functions/${functionId}/variables`);
            return payload.variables || payload.variablesList || [];
          }

          async function upsertVariable(functionId, variableId, key, value, secret) {
            const existing = (await listVariables(functionId)).find((item) => item.key === key);
            const body = { variableId, key, value, secret };
            if (existing?.$id) {
              await request(`/functions/${functionId}/variables/${existing.$id}`, { method: 'PUT', body });
              return;
            }
            await request(`/functions/${functionId}/variables`, { method: 'POST', body });
          }

          await upsertVariable('mgenetica_progress_fn', 'progress_appwrite_api_key', 'APPWRITE_API_KEY', apiKey, true);
          await upsertVariable('mgenetica_admin_fn', 'admin_appwrite_api_key', 'APPWRITE_API_KEY', apiKey, true);
          if (adminEmails.trim()) {
            await upsertVariable('mgenetica_admin_fn', 'admin_emails', 'ADMIN_EMAILS', adminEmails, false);
          }
          NODE
      - name: Re-activate functions after variable sync
        working-directory: appwrite
        run: appwrite push functions --all --force --activate true
