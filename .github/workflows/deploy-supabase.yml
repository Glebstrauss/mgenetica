name: Supabase deploy scaffold

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'backend/sql/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Supabase secrets
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "Supabase secrets not configured. Skipping migration push. Add SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY to repo secrets.";
            exit 0;
          fi
      - name: Install supabase CLI
        run: |
          npm i -g supabase
      - name: Push migrations (example)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "You can run: psql \"$SUPABASE_URL\" -f backend/sql/schema.sql" || true
          echo "Or use supabase migrations if configured. This step is a scaffold and requires project-specific setup." || true
      - name: Reminder
        run: |
          echo "Set SUPABASE_URL, SUPABASE_ANON_KEY and SUPABASE_SERVICE_ROLE_KEY in repository secrets to enable automated Supabase deploys."
