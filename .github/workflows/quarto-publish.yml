name: Render and Publish Quarto Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install R for Quarto render
        env:
          R_PROFILE_USER: /dev/null
        run: |
          export R_LIBS_USER="$RUNNER_TEMP/R-library"
          echo "R_LIBS_USER=$R_LIBS_USER" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends r-base-core libuv1-dev
          mkdir -p "$R_LIBS_USER"
          Rscript --version
          Rscript -e 'options(repos = c(RSPM = "https://packagemanager.posit.co/cran/__linux__/noble/latest")); install.packages(c("knitr", "rmarkdown"), Ncpus = 2)'

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup Node.js (for Pagefind)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Render Quarto site
        uses: quarto-dev/quarto-actions/render@v2
        env:
          R_PROFILE_USER: /dev/null
        with:
          path: .

      - name: Index with Pagefind
        run: npx --yes pagefind --site docs --output-subdir _pagefind

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
