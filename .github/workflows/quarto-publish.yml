name: Render and Publish Quarto Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup R (stable)
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup Node.js (for Pagefind)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore R packages with renv
        run: |
          Rscript -e 'repos <- Sys.getenv("RSPM", "https://packagemanager.posit.co/cran/__linux__/noble/latest"); install.packages("renv", repos = repos); renv::restore(prompt = FALSE)'

      - name: Render Quarto site
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: .

      - name: Index with Pagefind
        run: npx --yes pagefind --site docs --output-subdir _pagefind

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
