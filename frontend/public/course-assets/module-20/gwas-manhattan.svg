  <text x="97"  y="320" text-anchor="middle" fill="#8892a4" font-size="8">1</text>
  <text x="163" y="320" text-anchor="middle" fill="#8892a4" font-size="8">2</text>
  <text x="225" y="320" text-anchor="middle" fill="#8892a4" font-size="8">3</text>
