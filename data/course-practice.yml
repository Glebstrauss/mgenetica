    M4:
      formula_terms:
        - "p² é frequência esperada de AA sob acasalamento ao acaso."
        - "2pq é frequência esperada de heterozigotos."
        - "q² é frequência esperada de aa; p + q = 1 em sistema bialélico."
      manual_walkthrough:
        - "Com p = 0,70 e q = 0,30, calcule AA = 0,49, Aa = 0,42 e aa = 0,09. Em 100 animais, espere 49, 42 e 9."
        - "Se observado for 45, 46 e 9, diferença existe, mas é pequena. Interpretação deve considerar tamanho amostral, estrutura e erro de genotipagem."
      manual_result: "Esperado em 100 animais: 49 AA, 42 Aa, 9 aa."
      r_preview: |
        p <- 0.7
        esperado <- c(AA = p^2, Aa = 2*p*(1-p), aa = (1-p)^2) * 100
        esperado
      lab_interpretation: "Hardy-Weinberg serve como referência; desvio observado abre pergunta, não fecha diagnóstico sozinho."
      decision_prompt: "Diga se diferença pequena entre observado e esperado justifica concluir seleção imediatamente."
      lab_code: |
        # M4 — Hardy-Weinberg
        # Objetivo: comparar contagens observadas e esperadas.

        p <- 0.70
        q <- 1 - p
        n <- 100
        esperado <- c(AA = p^2, Aa = 2 * p * q, aa = q^2) * n
        observado <- c(AA = 45, Aa = 46, aa = 9)
        comparacao <- data.frame(
          genotipo = names(esperado),
          esperado = as.numeric(esperado),
          observado = as.numeric(observado),
          diferenca = as.numeric(observado - esperado)
        )

        print(comparacao)
        cat("\nINTERPRETACAO: Hardy-Weinberg é régua de comparação, não prova automática de causa.\n")

        dir.create("data", showWarnings = FALSE, recursive = TRUE)
        write.csv(comparacao, "data/modulo04_simulado.csv", row.names = FALSE)
        cat("Salvo em data/modulo04_simulado.csv\n")
      quiz_questions:
        - text: "Com p = 0,70, qual é frequência esperada de AA?"
          options: ["0,49", "0,42", "0,09"]
          correct: 0
        - text: "Com p = 0,70 e q = 0,30, qual é frequência esperada de Aa?"
          options: ["0,42", "0,49", "0,21"]
          correct: 0
        - text: "Desvio pequeno entre observado e esperado prova seleção?"
          options: ["Não. Pode envolver amostragem, estrutura ou erro.", "Sim. Qualquer diferença prova seleção.", "Sim. Heterozigotos nunca variam."]
          correct: 0
        - text: "Hardy-Weinberg deve ser usado como quê?"
          options: ["Modelo de referência.", "Regra obrigatória para todo rebanho.", "Índice de DEP."]
          correct: 0
        - text: "Qual evidência fecha melhor o bloco?"
          options: ["Tabela observado/esperado com interpretação cautelosa.", "Só escrever p² sem q.", "Ignorar contagens."]
          correct: 0
    M5:
      formula_terms:
        - "Seleção muda frequência de forma direcional quando genótipos têm sucesso reprodutivo diferente."
        - "Deriva muda frequência por acaso, com efeito mais forte em tamanho efetivo pequeno."
        - "Migração mistura frequências entre populações; mutação cria alelos novos, geralmente em baixa taxa."
      manual_walkthrough:
        - "Se p começa em 0,40 e seleção aumenta p em 0,05 por geração, após cinco gerações p esperado é 0,65."
        - "Em população pequena, sorteio de gametas pode levar p para cima ou para baixo mesmo sem vantagem. Por isso resposta observada precisa separar força direcional de ruído."
      manual_result: "Trajetória direcional simples: 0,40 -> 0,45 -> 0,50 -> 0,55 -> 0,60 -> 0,65."
      r_preview: |
        p <- 0.40
        for (g in 1:5) p <- p + 0.05
        p
      lab_interpretation: "População pequena mostra maior variação aleatória; seleção cria tendência, deriva cria incerteza."
      decision_prompt: "Compare trajetória dirigida e trajetória por sorteio; diga qual exige controle de tamanho efetivo."
      lab_code: |
        # M5 — Fatores que alteram frequências gênicas
        # Objetivo: comparar seleção direcional e deriva.

        set.seed(105)
        geracoes <- 0:5
        p_selecao <- 0.40 + 0.05 * geracoes
        deriva_pequena <- numeric(length(geracoes))
        deriva_pequena[1] <- 0.40
        Ne <- 20
        for (g in 2:length(geracoes)) {
          copias_A <- rbinom(1, size = 2 * Ne, prob = deriva_pequena[g - 1])
          deriva_pequena[g] <- copias_A / (2 * Ne)
        }
        resultado <- data.frame(
          geracao = geracoes,
          selecao_direcional = round(p_selecao, 3),
          deriva_pop_pequena = round(deriva_pequena, 3)
        )

        print(resultado)
        cat("\nINTERPRETACAO: seleção impõe direção; deriva pode deslocar frequência por acaso em população pequena.\n")

        dir.create("data", showWarnings = FALSE, recursive = TRUE)
        write.csv(resultado, "data/modulo05_simulado.csv", row.names = FALSE)
        cat("Salvo em data/modulo05_simulado.csv\n")
      quiz_questions:
        - text: "Se p aumenta 0,05 por geração a partir de 0,40, qual p após cinco gerações?"
          options: ["0,65", "0,45", "0,05"]
          correct: 0
        - text: "Qual processo é mudança aleatória mais forte em população pequena?"
          options: ["Deriva genética", "Seleção direcional", "Média fenotípica"]
          correct: 0
        - text: "Migração altera frequência por qual mecanismo?"
          options: ["Entrada ou saída de alelos entre populações.", "Cálculo de h².", "Conversão de fenótipo em DEP."]
          correct: 0
        - text: "Qual erro comum deve ser evitado?"
          options: ["Atribuir toda mudança observada à seleção sem considerar deriva.", "Comparar trajetórias por geração.", "Simular população pequena."]
          correct: 0
        - text: "Qual decisão prática vem desse bloco?"
          options: ["Controlar tamanho efetivo e origem dos reprodutores.", "Ignorar frequências gênicas.", "Selecionar sem registrar geração."]
          correct: 0
    M6:
      formula_terms:
        - "P é fenótipo observado."
        - "G é componente genético do valor."
        - "E é ambiente e erro; comparação genética exige reduzir ou ajustar E."
      manual_walkthrough:
        - "Animal A tem G = 10 e E = 3, então P = 13. Animal B tem G = 12 e E = -1, então P = 11."
        - "Ranking fenotípico coloca A acima de B, mas ranking genético coloca B acima de A. Isso mostra por que ajuste ambiental é central."
      manual_result: "A: P = 13, G = 10; B: P = 11, G = 12. Fenótipo e mérito genético podem discordar."
      r_preview: |
        dados <- data.frame(animal = c("A","B"), G = c(10,12), E = c(3,-1))
        dados$P <- dados$G + dados$E
        dados
      lab_interpretation: "Ambiente favorável pode inverter ranking fenotípico e mascarar mérito genético."
      decision_prompt: "Escolha animal por P e depois por G; explique por que decisões diferem."
      lab_code: |
        # M6 — Fenótipo, genótipo e ambiente
        # Objetivo: mostrar como ambiente altera ranking fenotípico.

        dados <- data.frame(
          animal = c("A", "B", "C"),
          G = c(10, 12, 9),
          E = c(3, -1, 2)
        )
        dados$P <- dados$G + dados$E
        dados$ranking_fenotipo <- rank(-dados$P, ties.method = "first")
        dados$ranking_genetico <- rank(-dados$G, ties.method = "first")

        print(dados)
        cat("\nINTERPRETACAO: comparar animais sem ajustar ambiente pode inverter decisão genética.\n")

