    M19:
      formula_terms:
        - "Call rate é proporção de genótipos observados."
        - "Missing rate é proporção de genótipos ausentes."
        - "MAF é frequência do alelo menos comum e indica informatividade do marcador."
      manual_walkthrough:
        - "Em vetor 0, 1, NA e 2, há uma falta em quatro observações; missing rate = 0,25 e call rate = 0,75."
        - "Filtro muito frouxo deixa erro; filtro rígido demais remove informação. Critério precisa ser registrado."
      manual_result: "Missing rate = 0,25; call rate = 0,75."
      r_preview: |
        x <- c(0, 1, NA, 2)
        mean(is.na(x))
      lab_interpretation: "Controle de qualidade protege matriz genômica contra sinal falso."
      decision_prompt: "Decida se marcador com 25% de falta passa em filtro de 10%."
      lab_code: |
        # M19 — Controle de qualidade genômica
        # Objetivo: calcular missing rate, call rate e MAF em matriz pequena.

        geno <- matrix(c(0, 1, NA, 2, 0, 0, 1, 1, 2, NA, 2, 2), nrow = 4, byrow = TRUE)
        colnames(geno) <- c("SNP1", "SNP2", "SNP3")
        missing_rate <- colMeans(is.na(geno))
        call_rate <- 1 - missing_rate
        maf <- apply(geno, 2, function(x) {
          p <- mean(x, na.rm = TRUE) / 2
          min(p, 1 - p)
        })
        resultado <- data.frame(SNP = colnames(geno), missing_rate, call_rate, MAF = maf)

        print(geno)
        print(resultado)
        cat("\nINTERPRETACAO: filtros devem remover erro sem descartar informação útil em excesso.\n")

        dir.create("data", showWarnings = FALSE, recursive = TRUE)
        write.csv(resultado, "data/modulo19_simulado.csv", row.names = FALSE)
        cat("Salvo em data/modulo19_simulado.csv\n")
      quiz_questions:
        - text: "Uma falta em quatro genótipos dá missing rate de..."
          options: ["0,25", "0,75", "4"]
          correct: 0
        - text: "Call rate correspondente é..."
          options: ["0,75", "0,25", "1,25"]
          correct: 0
        - text: "MAF baixa indica marcador..."
          options: ["pouco informativo em muitas análises.", "sempre melhor para GWAS.", "sem genótipo ausente obrigatoriamente."]
          correct: 0
        - text: "Filtro deve ser registrado por quê?"
          options: ["Para reprodutibilidade.", "Para esconder decisão.", "Para impedir validação."]
          correct: 0
        - text: "Qual erro comum deve ser evitado?"
          options: ["Aplicar filtro sem critério claro.", "Calcular call rate.", "Verificar dados faltantes."]
          correct: 0
    M20:
      formula_terms:
        - "Matriz G resume semelhança genômica entre animais."
        - "GWAS testa associação marcador a marcador."
        - "Predição genômica usa muitos marcadores simultaneamente para predizer mérito."
        - "A matriz do laboratório é pequena e pedagógica; avaliações reais usam milhares de marcadores e validação."
      manual_walkthrough:
        - "Padronizar matriz 0/1/2 evita comparar marcadores em escalas diferentes. Produto cruzado entre linhas gera medida simples de semelhança."
        - "GWAS e predição respondem perguntas diferentes: localizar sinais específicos ou predizer valor genético distribuído."
        - "Sem controle de qualidade e validação, matriz genômica ou predição pode parecer precisa sem ser confiável."
      manual_result: "Matriz G pequena mostra quais animais são mais semelhantes pelo conjunto de SNPs; o exemplo é didático e não representa uma rotina comercial completa."
      r_preview: |
        M <- matrix(c(0,1,2,1,1,0,2,1,0), nrow = 3)
        G <- tcrossprod(scale(M))
      lab_interpretation: "Matriz G depende de QC e padronização; sem validação, predição pode parecer melhor do que é."
      decision_prompt: "Diferencie quando usar GWAS e quando usar predição genômica."
      lab_code: |
        # M20 — Matriz G, GWAS e predição genômica
        # Objetivo: construir uma matriz genômica pequena para entender a lógica.
        # Observação: avaliações reais usam muitos SNPs, controle de qualidade e validação externa.

        M <- matrix(c(
          0, 1, 2,
          1, 1, 0,
          2, 1, 0,
          0, 0, 1
        ), nrow = 4, byrow = TRUE)
        rownames(M) <- paste0("A", 1:4)
        colnames(M) <- paste0("SNP", 1:3)
        M_pad <- scale(M)
        G <- tcrossprod(M_pad) / ncol(M)

        print(M)
        print(round(G, 3))
        cat("\nINTERPRETACAO: matriz G resume semelhança genômica; GWAS e predição usam SNPs para perguntas distintas.\n")
        cat("Este exemplo é pedagógico; em dados reais, QC, escala dos SNPs e validação são obrigatórios.\n")

        dir.create("data", showWarnings = FALSE, recursive = TRUE)
        write.csv(round(G, 3), "data/modulo20_simulado.csv")
        cat("Salvo em data/modulo20_simulado.csv\n")
      quiz_questions:
        - text: "Matriz G resume..."
          options: ["semelhança genômica entre animais.", "apenas média fenotípica.", "somente heterose."]
          correct: 0
        - text: "GWAS busca..."
          options: ["associação marcador a marcador.", "apenas parentesco de pedigree.", "somente h² por fórmula simples."]
          correct: 0
        - text: "Predição genômica usa..."
          options: ["muitos marcadores simultaneamente.", "um único SNP sem validação.", "apenas nome do animal."]
          correct: 0
        - text: "Por que padronizar SNPs?"
          options: ["Para evitar escalas diferentes entre marcadores.", "Para remover todos os alelos.", "Para transformar fenótipo em sexo."]
          correct: 0
        - text: "Qual erro comum deve ser evitado?"
          options: ["Confundir GWAS com predição genômica.", "Calcular matriz.", "Usar QC antes da análise."]
          correct: 0
