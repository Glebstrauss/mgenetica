    M14:
      formula_terms:
        - "Média parental é referência para calcular heterose."
        - "Heterose absoluta é desempenho F1 menos média parental."
        - "Heterose percentual divide diferença pela média parental."
      manual_walkthrough:
        - "Se raça A tem 210 kg e raça B tem 220 kg, média parental é 215 kg. Se F1 tem 230 kg, heterose absoluta é 15 kg."
        - "Heterose percentual é 15/215 = 0,0698, ou cerca de 7,0%. Isso informa vantagem do cruzado naquele sistema."
      manual_result: "Heterose absoluta = 15 kg; heterose percentual ≈ 7,0%."
      r_preview: |
        pais <- mean(c(210, 220))
        f1 <- 230
        (f1 - pais) / pais
      lab_interpretation: "Heterose ajuda desempenho do cruzado, mas depende de sistema organizado de acasalamento."
      decision_prompt: "Diga se heterose substitui seleção dentro das raças parentais."
      lab_code: |
        # M14 — Cruzamentos, heterose e complementaridade
        # Objetivo: calcular heterose absoluta e percentual.

        desempenho <- data.frame(grupo = c("Raca_A", "Raca_B", "F1"), peso = c(210, 220, 230))
        media_parental <- mean(desempenho$peso[desempenho$grupo %in% c("Raca_A", "Raca_B")])
        f1 <- desempenho$peso[desempenho$grupo == "F1"]
        heterose_abs <- f1 - media_parental
        heterose_pct <- heterose_abs / media_parental * 100
        resultado <- data.frame(media_parental, f1, heterose_abs, heterose_pct)

        print(desempenho)
        print(resultado)
        cat("\nINTERPRETACAO: heterose complementa seleção; não substitui planejamento de cruzamento.\n")

        dir.create("data", showWarnings = FALSE, recursive = TRUE)
        write.csv(resultado, "data/modulo14_simulado.csv", row.names = FALSE)
        cat("Salvo em data/modulo14_simulado.csv\n")
      quiz_questions:
        - text: "Com pais 210 e 220 kg, qual é média parental?"
          options: ["215 kg", "430 kg", "230 kg"]
          correct: 0
        - text: "Com F1 = 230 kg, qual heterose absoluta?"
          options: ["15 kg", "7 kg", "215 kg"]
          correct: 0
        - text: "Heterose percentual é aproximadamente..."
          options: ["7,0%", "15%", "230%"]
          correct: 0
        - text: "Heterose substitui seleção?"
          options: ["Não. Complementa estratégia de acasalamento.", "Sim. Elimina necessidade de seleção.", "Sim. Remove todo risco."]
          correct: 0
        - text: "Complementaridade significa..."
          options: ["combinar forças de grupos diferentes.", "usar sempre uma única raça.", "ignorar ambiente."]
          correct: 0
    M15:
      formula_terms:
        - "EBV estima valor genético do animal."
        - "DEP representa diferença esperada na progênie, geralmente metade do EBV aditivo."
        - "Acurácia indica confiança na estimativa e deve acompanhar ranking."
      manual_walkthrough:
        - "Se EBV = 20 kg, DEP aproximada é 10 kg. Isso significa que progênie desse animal tende a superar base de comparação em 10 kg, em média."
        - "Um animal com DEP alta e baixa acurácia pode ser mais incerto que outro com DEP moderada e alta acurácia."
      manual_result: "EBV = 20 kg implica DEP aproximada = 10 kg."
      r_preview: |
        ebv <- c(20, 8, -4)
        dep <- ebv / 2
        dep
      lab_interpretation: "Ranking por DEP deve ser lido junto com acurácia e base de comparação."
      decision_prompt: "Compare animal de maior DEP com animal de maior acurácia e justifique escolha."
      lab_code: |
        # M15 — Avaliação genética: DEP/EBV
        # Objetivo: comparar ranking por EBV, DEP e acurácia.

        animais <- data.frame(
          animal = c("T1", "T2", "T3", "T4"),
          EBV = c(20, 8, -4, 16),
          acuracia = c(0.55, 0.80, 0.70, 0.75)
        )
        animais$DEP <- animais$EBV / 2
        ranking <- animais[order(animais$DEP, decreasing = TRUE), ]

        print(ranking)
        cat("\nINTERPRETACAO: DEP traduz mérito esperado na progênie; acurácia informa confiança.\n")

        dir.create("data", showWarnings = FALSE, recursive = TRUE)
        write.csv(ranking, "data/modulo15_simulado.csv", row.names = FALSE)
        cat("Salvo em data/modulo15_simulado.csv\n")
      quiz_questions:
        - text: "Se EBV = 20 kg, qual DEP aproximada?"
          options: ["10 kg", "20 kg", "40 kg"]
          correct: 0
        - text: "O que DEP representa?"
          options: ["Diferença esperada na progênie.", "Peso bruto do animal.", "Frequência alélica."]
          correct: 0
        - text: "Por que acurácia importa?"
          options: ["Porque informa confiança na estimativa.", "Porque substitui DEP.", "Porque mede cor do animal."]
          correct: 0
        - text: "Ranking fenotípico basta?"
          options: ["Não. Pode misturar ambiente e genética.", "Sim. Sempre é melhor.", "Sim. Dispensa dados de parentes."]
          correct: 0
        - text: "Qual decisão é mais defensável?"
          options: ["Ler DEP junto com acurácia e objetivo de seleção.", "Escolher maior fenótipo bruto sempre.", "Ignorar base de comparação."]
          correct: 0
    M16:
      formula_terms:
        - "Efeito fixo representa fonte sistemática de variação, como fazenda ou sexo."
        - "Efeito aleatório representa variação atribuída a unidades amostradas, como animal."
        - "Modelo linear simples ajusta efeitos fixos; modelo misto acrescenta efeitos aleatórios, como animal."
        - "Modelo ajustado evita confundir manejo com mérito genético."
      manual_walkthrough:
        - "Se uma fazenda tem média 20 kg acima de outra por manejo, animal dessa fazenda pode parecer superior no fenótipo bruto."
        - "Modelo com fazenda e sexo ajusta parte sistemática antes de comparar resíduos. Em avaliação genética, o próximo passo é tratar animal como efeito aleatório."
      manual_result: "Ajuste por fazenda/sexo muda comparação quando grupos têm ambientes diferentes; o exemplo é uma ponte para modelos mistos, não uma avaliação genética completa."
      r_preview: |
        dados <- data.frame(peso = c(200,210,230,240), fazenda = c("A","A","B","B"), sexo = c("F","M","F","M"))
        coef(lm(peso ~ fazenda + sexo, data = dados))
      lab_interpretation: "Efeito de fazenda não deve ser interpretado como valor genético; este laboratório usa modelo linear como etapa didática antes do modelo misto."
      decision_prompt: "Explique por que ranking bruto pode ser injusto quando fazendas diferem."
      lab_code: |
        # M16 — Modelos lineares e mistos
        # Objetivo: ajustar efeito de fazenda e sexo em exemplo pequeno.
        # Observação: este é um modelo linear didático; modelo misto completo entra no próximo módulo.

        dados <- data.frame(
          animal = paste0("A", 1:8),
          peso = c(200, 208, 212, 220, 230, 238, 242, 250),
          fazenda = rep(c("F1", "F2"), each = 4),
          sexo = rep(c("F", "M"), 4)
        )
        ajuste <- lm(peso ~ fazenda + sexo, data = dados)
        resultado <- data.frame(termo = names(coef(ajuste)), estimativa = as.numeric(coef(ajuste)))

        print(dados)
        print(resultado)
        cat("\nINTERPRETACAO: modelo separa efeitos sistemáticos antes de comparar animais.\n")
        cat("Este laboratório usa lm() como ponte didática; avaliação genética completa exige efeitos aleatórios e parentesco.\n")

        dir.create("data", showWarnings = FALSE, recursive = TRUE)
        write.csv(resultado, "data/modulo16_simulado.csv", row.names = FALSE)
        cat("Salvo em data/modulo16_simulado.csv\n")
      quiz_questions:
        - text: "Fazenda costuma entrar como que tipo de efeito?"
          options: ["Efeito fixo", "Frequência alélica", "Limiar genômico"]
          correct: 0
        - text: "Animal em modelo misto costuma ser tratado como..."
          options: ["efeito aleatório.", "p².", "heterose percentual."]
          correct: 0
        - text: "Por que ajustar fazenda?"
          options: ["Para não confundir manejo com mérito genético.", "Para remover toda genética.", "Para mudar alelos."]
          correct: 0
        - text: "Coeficiente de sexo/fazenda é automaticamente genético?"
          options: ["Não. É efeito sistemático do grupo.", "Sim. Sempre é EBV.", "Sim. Sempre é DEP."]
          correct: 0
        - text: "Qual erro comum deve ser evitado?"
          options: ["Interpretar efeito de manejo como valor genético.", "Definir variável resposta.", "Usar modelo simples para aprender."]
          correct: 0
    M17:
      formula_terms:
        - "BLUP prediz efeitos aleatórios usando dados e estrutura de variância."
        - "Modelo animal conecta animais pela matriz de parentesco."
        - "Encolhimento reduz estimativas extremas quando evidência é fraca."
        - "O exemplo abaixo é uma analogia numérica; BLUP real resolve equações de modelo misto."
      manual_walkthrough:
        - "Animal com desvio fenotípico alto, mas poucos registros, não deve receber EBV extremo sem cautela. BLUP tende a aproximar estimativa da média quando informação é limitada."
        - "Parentes ajudam porque compartilham informação genética esperada. Isso é essencial para animais jovens ou pouco medidos."
        - "Neste exemplo didático, h² reduz o desvio fenotípico e a confiança relativa reduz ainda mais quando há poucos registros."
      manual_result: "Com h² = 0,30, desvio 20 e apenas 1/8 da informação máxima, EBV simplificado = 0,75; o fenótipo extremo vira estimativa cautelosa."
      r_preview: |
        desvio <- 20
        h2 <- 0.30
        confianca_relativa <- 1/8
        ebv_simplificado <- h2 * desvio * confianca_relativa
      lab_interpretation: "Encolhimento não é erro; é controle de incerteza. O cálculo é didático e não substitui BLUP por modelo animal."
      decision_prompt: "Explique por que animal jovem com parentes bons pode ganhar informação antes de ter muitos registros."
      lab_code: |
        # M17 — BLUP e modelo animal
        # Objetivo: demonstrar a intuição do encolhimento de EBV.
        # Observação: isto é uma analogia didática; BLUP real usa equações de modelo misto e matriz de parentesco.

        animais <- data.frame(
          animal = c("A1", "A2", "A3"),
          desvio_fenotipico = c(20, 10, -5),
          registros = c(1, 5, 8)
        )
        h2 <- 0.30
        confianca_relativa <- animais$registros / max(animais$registros)
        animais$EBV_simplificado <- h2 * animais$desvio_fenotipico * confianca_relativa

        print(animais)
        cat("\nINTERPRETACAO: pouca informação reduz estimativas extremas; parentesco ajuda completar evidência.\n")
        cat("O cálculo é simplificado para intuição; BLUP real exige modelo misto e matriz de parentesco.\n")

        dir.create("data", showWarnings = FALSE, recursive = TRUE)
        write.csv(animais, "data/modulo17_simulado.csv", row.names = FALSE)
        cat("Salvo em data/modulo17_simulado.csv\n")
      quiz_questions:
        - text: "O que BLUP faz em termos gerais?"
          options: ["Prediz efeitos aleatórios usando dados e variâncias.", "Conta apenas alelos A.", "Calcula heterose percentual."]
          correct: 0
        - text: "Por que ocorre encolhimento?"
          options: ["Porque pouca informação aumenta incerteza.", "Porque fenótipo não existe.", "Porque todo animal tem mesmo genótipo."]
          correct: 0
        - text: "Modelo animal usa qual informação estrutural?"
          options: ["Parentesco entre animais.", "Apenas cor da pelagem.", "Somente p²."]
          correct: 0
        - text: "BLUP é igual a média fenotípica?"
          options: ["Não. Ajusta informação e estrutura de variância.", "Sim. Sempre idêntico.", "Sim. Ignora parentes."]
          correct: 0
        - text: "Qual aplicação é importante?"
          options: ["Predizer animais jovens ou pouco medidos.", "Substituir todos os registros.", "Ignorar acurácia."]
          correct: 0
    M18:
      formula_terms:
        - "Genótipo SNP 0, 1 e 2 conta cópias de um alelo."
        - "Frequência alélica pode ser estimada pela média dos códigos dividida por 2."
        - "Marcadores distribuídos no genoma ajudam estimar parentesco realizado."
      manual_walkthrough:
        - "Para códigos 0, 1, 2, 1 e 0, soma = 4. Há 5 animais e 10 cópias possíveis. Frequência do alelo contado é 4/10 = 0,40."
        - "Essa frequência informa composição do marcador. Um SNP isolado raramente justifica decisão de seleção."
      manual_result: "Frequência alélica do exemplo = 0,40."
      r_preview: |
        snp <- c(0,1,2,1,0)
        mean(snp) / 2
      lab_interpretation: "SNP codifica cópias alélicas; decisão genômica robusta usa muitos marcadores."
      decision_prompt: "Explique por que um SNP isolado não deve definir reprodutor superior."
      lab_code: |
        # M18 — Genômica e SNP
        # Objetivo: codificar SNPs e calcular frequência alélica.

        snp <- c(0, 1, 2, 1, 0)
        animais <- paste0("A", 1:5)
        dados <- data.frame(animal = animais, SNP1 = snp)
        freq_alelo <- mean(dados$SNP1) / 2
        resultado <- data.frame(marcador = "SNP1", frequencia_alelo_contado = freq_alelo)

        print(dados)
        print(resultado)
        cat("\nINTERPRETACAO: código 0/1/2 conta cópias; vários SNPs sustentam parentesco genômico.\n")

        dir.create("data", showWarnings = FALSE, recursive = TRUE)
