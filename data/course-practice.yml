    M12:
      formula_terms:
        - "Escala subjacente representa risco ou suscetibilidade contínua."
        - "Limiar separa classes observadas, como doente/não doente ou prenhe/não prenhe."
        - "Prevalência é proporção de animais acima ou abaixo do limiar."
      manual_walkthrough:
        - "Imagine valores de suscetibilidade -1, 0, 0,5, 1,2 e 1,8. Com limiar 1, dois de cinco animais passam do limite."
        - "A prevalência observada é 2/5 = 0,40. Mudar limiar ou média populacional muda proporção observada sem tornar a característica simples."
      manual_result: "Com limiar 1, prevalência = 0,40 no exemplo de cinco animais."
      r_preview: |
        x <- c(-1, 0, 0.5, 1.2, 1.8)
        mean(x > 1)
      lab_interpretation: "Categoria observada pode esconder variação contínua importante para seleção."
      decision_prompt: "Explique por que baixa prevalência exige cuidado com tamanho de amostra."
      lab_code: |
        # M12 — Características de limiar
        # Objetivo: relacionar escala contínua e resposta binária.

        suscetibilidade <- c(-1, 0, 0.5, 1.2, 1.8)
        limiar <- 1
        categoria <- ifelse(suscetibilidade > limiar, "afetado", "nao_afetado")
        dados <- data.frame(animal = paste0("A", 1:5), suscetibilidade, categoria)
        prevalencia <- mean(categoria == "afetado")

        print(dados)
        cat("Prevalencia:", prevalencia, "\n")
        cat("\nINTERPRETACAO: dado binário pode vir de risco contínuo não observado diretamente.\n")

        dir.create("data", showWarnings = FALSE, recursive = TRUE)
        write.csv(dados, "data/modulo12_simulado.csv", row.names = FALSE)
