course_practice:
  purpose: "Transformar módulos prioritários em padrão de aula completa: cálculo manual, R coerente, interpretação e quiz com distratores conceituais reais."
  priority_modules: [M1, M2, M3, M4, M5, M6, M7, M8, M9, M10, M11, M12, M13, M14, M15, M16, M17, M18, M19, M20, M21]
  modules:
    M1:
      formula_terms:
        - "AA, Aa e aa representam genótipos possíveis em um loco com dois alelos."
        - "A proporção 1:2:1 é expectativa de descendentes de Aa x Aa, não promessa em n pequeno."
        - "Fenótipo observado pode ou não revelar genótipo, conforme dominância, ambiente e forma de mensuração."
      manual_walkthrough:
        - "Monte quadro de Punnett com gametas A e a em cada pai. As quatro combinações possíveis são AA, Aa, Aa e aa. Agrupando iguais, há um AA, dois Aa e um aa."
        - "Se nascerem 20 descendentes, a expectativa aproximada é 5 AA, 10 Aa e 5 aa. Em rebanho real, contagem pode variar por acaso, erro de registro ou seleção antes da mensuração."
      manual_result: "Proporção esperada AA:Aa:aa = 1:2:1; em 20 animais, expectativa aproximada = 5, 10 e 5."
      r_preview: |
        genotipos <- c("AA", "Aa", "Aa", "aa")
        esperado <- table(genotipos) / length(genotipos)
        round(esperado * 20)
      lab_interpretation: "Aumentar n aproxima contagens da expectativa; n pequeno mostra oscilação amostral."
      decision_prompt: "Explique se uma contagem diferente de 1:2:1 prova erro genético ou pode ser variação amostral."
      lab_code: |
        # M1 — Revisão de genética básica
        # Objetivo: comparar expectativa mendeliana e amostra real pequena.

        set.seed(101)

        gametas_pai <- c("A", "a")
        gametas_mae <- c("A", "a")
        quadro <- expand.grid(pai = gametas_pai, mae = gametas_mae)
        quadro$genotipo <- ifelse(
          quadro$pai == quadro$mae,
          paste0(quadro$pai, quadro$mae),
          "Aa"
        )

        esperado <- prop.table(table(quadro$genotipo))
        n <- 20
        amostra <- sample(names(esperado), n, replace = TRUE, prob = as.numeric(esperado))
        observado <- table(factor(amostra, levels = names(esperado)))

        resultado <- data.frame(
          genotipo = names(esperado),
          proporcao_esperada = as.numeric(esperado),
          contagem_esperada = as.numeric(esperado) * n,
          contagem_observada = as.numeric(observado)
        )

        print(resultado)
        cat("\nINTERPRETACAO: expectativa mendeliana orienta previsão; amostra pequena pode oscilar.\n")

        dir.create("data", showWarnings = FALSE, recursive = TRUE)
        write.csv(resultado, "data/modulo01_simulado.csv", row.names = FALSE)
        cat("Salvo em data/modulo01_simulado.csv\n")
      quiz_questions:
        - text: "Em Aa x Aa, qual expectativa genotípica é correta?"
          options: ["1 AA : 2 Aa : 1 aa", "1 AA : 1 Aa : 1 aa", "Todos Aa, porque ambos os pais carregam A e a"]
          correct: 0
        - text: "Em 20 descendentes, observar 4 AA, 11 Aa e 5 aa significa necessariamente erro?"
          options: ["Não. Amostra pequena pode oscilar ao redor da expectativa.", "Sim. Toda amostra deve repetir 5, 10 e 5 exatamente.", "Sim. Heterozigotos não podem ser maioria."]
          correct: 0
        - text: "Qual frase separa melhor genótipo e fenótipo?"
          options: ["Genótipo é combinação alélica; fenótipo é característica observada sob genética e ambiente.", "Fenótipo é sempre cópia exata do genótipo.", "Genótipo só existe em características quantitativas."]
          correct: 0
        - text: "Qual erro comum deve ser evitado?"
          options: ["Concluir mérito genético só pelo fenótipo observado.", "Usar quadro de Punnett para prever proporções.", "Contar AA, Aa e aa em tabela."]
          correct: 0
        - text: "No laboratório, por que aumentar n ajuda?"
          options: ["Porque reduz oscilação amostral relativa.", "Porque muda a regra de segregação.", "Porque transforma aa em Aa."]
          correct: 0
    M3:
      formula_terms:
        - "N é número total de animais genotipados."
        - "AA contribui com duas cópias de A; Aa contribui com uma cópia de A e uma de a."
        - "p e q são frequências alélicas; devem somar 1 quando há só dois alelos."
      manual_walkthrough:
        - "Considere 10 AA, 5 Aa e 5 aa. Há 20 animais e 40 cópias alélicas. O alelo A aparece 2*10 + 5 = 25 vezes."
        - "A frequência de A é p = 25/40 = 0,625. A frequência de a é q = 1 - p = 0,375. Genótipo mais comum não é automaticamente melhor; é só mais frequente."
      manual_result: "p = 0,625; q = 0,375; frequências genotípicas = 0,50 AA, 0,25 Aa, 0,25 aa."
      r_preview: |
        gen <- c(rep("AA", 10), rep("Aa", 5), rep("aa", 5))
        p <- (2 * sum(gen == "AA") + sum(gen == "Aa")) / (2 * length(gen))
        c(p = p, q = 1 - p)
      lab_interpretation: "Frequência alélica descreve composição genética da população, não valor produtivo do alelo."
      decision_prompt: "Diga se o alelo A deve ser selecionado apenas por ser mais frequente."
      lab_code: |
        # M3 — Frequências alélicas e genotípicas
        # Objetivo: calcular p, q e frequências genotípicas em rebanho pequeno.

        gen <- c(rep("AA", 10), rep("Aa", 5), rep("aa", 5))
        n <- length(gen)

        freq_genotipica <- prop.table(table(factor(gen, levels = c("AA", "Aa", "aa"))))
        p <- (2 * sum(gen == "AA") + sum(gen == "Aa")) / (2 * n)
        q <- 1 - p

        resultado <- data.frame(
          medida = c("freq_AA", "freq_Aa", "freq_aa", "p_A", "q_a"),
          valor = c(as.numeric(freq_genotipica), p, q)
        )

        print(resultado)
        cat("\nINTERPRETACAO: p e q mostram composição alélica; decisão de seleção exige efeito do alelo.\n")

        dir.create("data", showWarnings = FALSE, recursive = TRUE)
        write.csv(resultado, "data/modulo03_simulado.csv", row.names = FALSE)
        cat("Salvo em data/modulo03_simulado.csv\n")
      quiz_questions:
        - text: "Com 10 AA, 5 Aa e 5 aa, qual é p para alelo A?"
          options: ["0,625", "0,500", "0,250"]
          correct: 0
        - text: "Por que Aa entra uma vez no numerador de p?"
          options: ["Porque carrega uma cópia de A.", "Porque carrega duas cópias de A.", "Porque não contribui para frequência alélica."]
          correct: 0
        - text: "O que p + q deve valer em sistema com dois alelos?"
          options: ["1", "2N", "Número de genótipos"]
          correct: 0
        - text: "Alelo mais frequente deve ser selecionado automaticamente?"
          options: ["Não. Frequência não informa sozinha efeito produtivo.", "Sim. Frequência alta sempre indica superioridade.", "Sim. Alelo raro sempre é prejudicial."]
          correct: 0
        - text: "Qual evidência fecha melhor este bloco?"
          options: ["Tabela com frequências genotípicas, p, q e interpretação.", "Lista de animais sem cálculo.", "Gráfico sem explicar alelos."]
          correct: 0
    M7:
      formula_terms:
        - "Valor quantitativo pode ser soma de muitos efeitos pequenos mais ambiente."
        - "Média resume centro da distribuição; variância resume dispersão."
        - "Mais loci segregando tendem a gerar mais classes fenotípicas."
      manual_walkthrough:
        - "Use três loci codificados como 0, 1 e 2. Um animal com soma 0 tem poucos alelos favoráveis; outro com soma 6 tem muitos. Valores intermediários aparecem por combinações diferentes."
        - "Quando o número de loci aumenta, categorias discretas ficam numerosas e a característica passa a parecer contínua, como peso, leite ou ganho diário."
      manual_result: "Três loci 0/1/2 produzem soma entre 0 e 6; mais loci aumentam número de valores possíveis."
      r_preview: |
        set.seed(7)
        genotipos <- matrix(sample(0:2, 60, replace = TRUE), ncol = 3)
        valor_genetico <- rowSums(genotipos)
        summary(valor_genetico)
      lab_interpretation: "Distribuição contínua surge da soma de muitos efeitos; ambiente amplia sobreposição entre animais."
      decision_prompt: "Explique por que seleção para peso usa médias e variâncias, não classes mendelianas simples."
      lab_code: |
        # M7 — Noções de genética quantitativa
        # Objetivo: simular muitos loci pequenos e observar distribuição contínua.

        set.seed(107)
        n_animais <- 80
        n_loci <- 10

        genotipos <- matrix(sample(0:2, n_animais * n_loci, replace = TRUE), nrow = n_animais)
        valor_genetico <- rowSums(genotipos)
        ambiente <- rnorm(n_animais, mean = 0, sd = 2)
        fenotipo <- valor_genetico + ambiente

        dados <- data.frame(
          animal = paste0("A", sprintf("%02d", 1:n_animais)),
          valor_genetico = valor_genetico,
          ambiente = round(ambiente, 2),
          fenotipo = round(fenotipo, 2)
        )

        print(summary(dados[, c("valor_genetico", "fenotipo")]))
        cat("\nINTERPRETACAO: muitos loci criam escala contínua; ambiente aumenta sobreposição entre animais.\n")

        dir.create("data", showWarnings = FALSE, recursive = TRUE)
        write.csv(dados, "data/modulo07_simulado.csv", row.names = FALSE)
        cat("Salvo em data/modulo07_simulado.csv\n")
      quiz_questions:
        - text: "Por que peso não costuma seguir proporção mendeliana simples?"
          options: ["Porque muitos genes e ambiente contribuem juntos.", "Porque peso não tem base genética.", "Porque todo peso é determinado por um único gene."]
          correct: 0
        - text: "O que acontece ao aumentar número de loci pequenos?"
          options: ["Aumenta número de valores intermediários.", "Todos os animais ficam iguais.", "A variância necessariamente vira zero."]
          correct: 0
        - text: "Qual medida resume dispersão entre animais?"
          options: ["Variância", "Nome do animal", "Número da fazenda sem dados"]
          correct: 0
        - text: "No laboratório, por que fenótipo pode sobrepor animais com valores genéticos diferentes?"
          options: ["Porque ambiente adiciona variação.", "Porque genótipo não existe.", "Porque R remove todos os efeitos."]
          correct: 0
        - text: "Qual decisão prática depende desse conceito?"
          options: ["Usar média e variância para selecionar características contínuas.", "Classificar peso só em AA, Aa e aa.", "Ignorar registros ambientais."]
          correct: 0
    M9:
      formula_terms:
        - "VA é variância genética aditiva."
        - "VP é variância fenotípica total."
        - "h² = VA/VP descreve proporção da variação entre animais explicada por efeitos aditivos."
      manual_walkthrough:
        - "Se VA = 40 e VP = 100, h² = 0,40. Isso não significa que 40% do peso de um animal é genético; significa que 40% da variação observada entre animais é aditiva."
        - "Se ambiente fica mais variável e VP sobe para 160 mantendo VA = 40, h² cai para 0,25. O sinal genético ficou proporcionalmente mais difícil de enxergar."
      manual_result: "h² inicial = 0,40; com VP = 160, h² = 0,25."
      r_preview: |
        VA <- 40
        VP <- c(100, 160)
        VA / VP
      lab_interpretation: "Ambiente mais heterogêneo reduz h² aparente e enfraquece seleção por fenótipo."
      decision_prompt: "Decida se vale melhorar padronização ambiental antes de intensificar seleção fenotípica."
      lab_code: |
        # M9 — Herdabilidade e repetibilidade
        # Objetivo: comparar herdabilidade sob ambientes com diferente variância.

        cenarios <- data.frame(
          cenario = c("ambiente_controlado", "ambiente_heterogeneo"),
          VA = c(40, 40),
          VE = c(60, 120)
        )
        cenarios$VP <- cenarios$VA + cenarios$VE
        cenarios$h2 <- cenarios$VA / cenarios$VP

        print(cenarios)
        cat("\nINTERPRETACAO: mesma VA gera h2 menor quando VE aumenta.\n")

        dir.create("data", showWarnings = FALSE, recursive = TRUE)
        write.csv(cenarios, "data/modulo09_simulado.csv", row.names = FALSE)
        cat("Salvo em data/modulo09_simulado.csv\n")
      quiz_questions:
        - text: "Com VA = 40 e VP = 100, qual é h²?"
          options: ["0,40", "2,50", "60"]
          correct: 0
        - text: "Qual interpretação de h² está correta?"
          options: ["Proporção da variação entre animais explicada por variância aditiva.", "Percentual genético de um animal individual.", "Proporção de animais selecionados."]
          correct: 0
        - text: "Se VE aumenta e VA fica igual, o que tende a ocorrer com h²?"
          options: ["Diminui", "Aumenta sempre", "Vira 1 automaticamente"]
          correct: 0
        - text: "Quando repetibilidade ajuda?"
          options: ["Ao decidir se nova medida do mesmo animal acrescenta informação.", "Ao substituir todo pedigree.", "Ao calcular p e q."]
          correct: 0
        - text: "Qual decisão prática é coerente com h² baixa?"
          options: ["Melhorar qualidade/quantidade de registros antes de confiar só no fenótipo.", "Descartar a característica para sempre.", "Ignorar ambiente."]
          correct: 0
    M10:
      formula_terms:
        - "S é diferencial de seleção: média dos selecionados menos média da população."
        - "h² indica quanto do diferencial fenotípico tende a aparecer como resposta aditiva."
        - "R é resposta esperada por geração; ganho por ano depende do intervalo de geração."
      manual_walkthrough:
        - "Considere pesos de 10 touros: 180, 190, 195, 200, 205, 210, 215, 220, 225 e 230 kg. A média populacional é 207 kg. Selecionando os três maiores, média dos selecionados é 225 kg."
        - "O diferencial é S = 225 - 207 = 18 kg. Com h² = 0,30, resposta esperada é R = 5,4 kg por geração. Se intervalo de geração for 3 anos, ganho aproximado é 1,8 kg/ano."
      manual_result: "S = 18 kg; R = 5,4 kg/geração; ganho anual aproximado = 1,8 kg/ano."
      r_preview: |
        peso <- c(180,190,195,200,205,210,215,220,225,230)
        selecionados <- sort(peso, decreasing = TRUE)[1:3]
        S <- mean(selecionados) - mean(peso)
        R <- 0.30 * S
        R
      lab_interpretation: "Selecionar poucos animais aumenta S, mas reduz número de pais e pode aumentar endogamia."
      decision_prompt: "Compare top 30% e top 50% e escolha estratégia considerando ganho e risco."
      lab_code: |
        # M10 — Seleção e ganho genético
        # Objetivo: calcular S, R e ganho por ano com dados pequenos.

        peso <- c(180, 190, 195, 200, 205, 210, 215, 220, 225, 230)
        animais <- paste0("T", sprintf("%02d", seq_along(peso)))
        dados <- data.frame(animal = animais, peso = peso)

        h2 <- 0.30
        intervalo_geracao <- 3
        n_selecionados <- 3

        selecionados <- dados[order(dados$peso, decreasing = TRUE), ][1:n_selecionados, ]
        media_pop <- mean(dados$peso)
        media_sel <- mean(selecionados$peso)
        S <- media_sel - media_pop
        R <- h2 * S
        ganho_ano <- R / intervalo_geracao

        resultado <- data.frame(
          media_populacao = media_pop,
          media_selecionados = media_sel,
          diferencial_S = S,
          h2 = h2,
          resposta_R = R,
          intervalo_geracao = intervalo_geracao,
          ganho_por_ano = ganho_ano
        )

        print(dados)
        print(selecionados)
        print(resultado)
        cat("\nINTERPRETACAO: maior intensidade aumenta S, mas deve ser equilibrada com número de pais e endogamia.\n")

        dir.create("data", showWarnings = FALSE, recursive = TRUE)
        write.csv(resultado, "data/modulo10_simulado.csv", row.names = FALSE)
        cat("Salvo em data/modulo10_simulado.csv\n")
      quiz_questions:
        - text: "Pesos têm média 207 kg e selecionados média 225 kg. Qual é S?"
          options: ["18 kg", "5,4 kg", "1,8 kg/ano"]
          correct: 0
        - text: "Com h² = 0,30 e S = 18 kg, qual é R?"
          options: ["5,4 kg por geração", "18 kg por geração", "60 kg por geração"]
          correct: 0
        - text: "Por que ganho por ano pode ser menor que R?"
          options: ["Porque R é por geração e deve considerar intervalo de geração.", "Porque herdabilidade sempre é zero.", "Porque selecionados não têm média."]
          correct: 0
        - text: "Qual risco aumenta quando seleção fica muito intensa com poucos pais?"
          options: ["Endogamia e perda de diversidade.", "Maior número efetivo.", "Mais famílias independentes."]
          correct: 0
        - text: "Qual interpretação é correta?"
          options: ["R é expectativa média, não promessa para cada descendente.", "R garante que todos os filhos ganham 5,4 kg.", "S e R são sempre iguais."]
          correct: 0
    M13:
      formula_terms:
        - "Parentesco esperado mede compartilhamento de alelos por ancestralidade."
        - "F mede probabilidade de dois alelos em um indivíduo serem idênticos por descendência."
        - "Na matriz A, diagonal 1 + F indica endogamia individual."
      manual_walkthrough:
        - "Dois meio-irmãos compartilham um progenitor. A expectativa de parentesco aditivo entre eles é 0,25. Irmãos completos compartilham pai e mãe, então expectativa é 0,50."
        - "Se acasalamento usa animais muito aparentados repetidamente, F aumenta. Isso pode expor alelos recessivos desfavoráveis e reduzir desempenho médio."
      manual_result: "Parentesco esperado: meio-irmãos = 0,25; irmãos completos = 0,50; diagonal de animal endogâmico = 1 + F."
      r_preview: |
        A <- matrix(c(1, .25, .25, 1), nrow = 2)
        rownames(A) <- colnames(A) <- c("Animal1", "Animal2")
        A
      lab_interpretation: "Parentesco não é sempre ruim; risco surge quando ele limita diversidade e aumenta F."
      decision_prompt: "Explique por que melhor animal por DEP pode não ser melhor acasalamento se parentesco com fêmeas for alto."
      lab_code: |
        # M13 — Endogamia e parentesco
        # Objetivo: comparar parentesco esperado entre tipos de família.

        pares <- data.frame(
          par = c("nao_aparentados", "meio_irmaos", "irmaos_completos", "pai_filho"),
          parentesco_esperado = c(0.00, 0.25, 0.50, 0.50)
        )
        pares$risco_acasalamento <- ifelse(pares$parentesco_esperado >= 0.50, "alto", ifelse(pares$parentesco_esperado > 0, "moderado", "baixo"))

        A_meio_irmaos <- matrix(c(1, 0.25, 0.25, 1), nrow = 2)
        rownames(A_meio_irmaos) <- colnames(A_meio_irmaos) <- c("M1", "M2")

        print(pares)
        print(A_meio_irmaos)
        cat("\nINTERPRETACAO: parentesco ajuda avaliação, mas acasalamento entre aparentados aumenta risco de endogamia.\n")

        dir.create("data", showWarnings = FALSE, recursive = TRUE)
        write.csv(pares, "data/modulo13_simulado.csv", row.names = FALSE)
        cat("Salvo em data/modulo13_simulado.csv\n")
      quiz_questions:
        - text: "Qual parentesco esperado entre meio-irmãos?"
          options: ["0,25", "0,50", "1,00"]
          correct: 0
        - text: "Na matriz A, o que representa diagonal 1 + F?"
          options: ["Endogamia individual incorporada à diagonal.", "Frequência alélica p.", "Média fenotípica ajustada."]
          correct: 0
        - text: "Parentesco deve ser sempre evitado?"
          options: ["Não. Ele informa avaliação, mas precisa controle em acasalamentos.", "Sim. Qualquer parentesco invalida avaliação.", "Não existe parentesco em pedigree."]
          correct: 0
        - text: "Qual risco vem de acasalamentos aparentados repetidos?"
          options: ["Aumento de endogamia e expressão de recessivos desfavoráveis.", "Redução automática de F.", "Eliminação de todos os alelos ruins em uma geração."]
          correct: 0
        - text: "Qual decisão prática usa parentesco?"
          options: ["Evitar acasalamento de reprodutor muito aparentado às fêmeas do lote.", "Escolher só pelo maior peso bruto.", "Ignorar matriz A."]
          correct: 0
    M21:
      formula_terms:
        - "DEP mede mérito esperado na progênie em unidade da característica."
        - "Acurácia informa confiança relativa na estimativa."
        - "Penalidade por parentesco reduz prioridade de animais que aumentam risco de endogamia no conjunto."
      manual_walkthrough:
        - "Compare quatro touros com DEP, acurácia e parentesco médio com fêmeas. Um índice simples pode ser score = DEP - 10*parentesco + 2*acurácia."
        - "Se T1 tem DEP 18, parentesco 0,20 e acurácia 0,70, score = 18 - 2 + 1,4 = 17,4. Animal com maior DEP pode perder posição se tiver parentesco alto ou baixa confiança."
      manual_result: "Ranking deve equilibrar mérito, risco e confiança; maior DEP isolada não basta."
      r_preview: |
        touros <- data.frame(touro = c("T1","T2","T3","T4"), DEP = c(18,15,12,20), acuracia = c(.70,.85,.60,.50), parentesco = c(.20,.05,.02,.35))
        touros$score <- touros$DEP - 10 * touros$parentesco + 2 * touros$acuracia
        touros[order(touros$score, decreasing = TRUE), ]
      lab_interpretation: "Pipeline bom registra regra de decisão; sem regra, ranking vira preferência subjetiva."
      decision_prompt: "Escolha dois touros e justifique por DEP, acurácia e parentesco, não por um único número."
      lab_code: |
        # M21 — Projeto final: pipeline completo de seleção
        # Objetivo: montar ranking com DEP, acurácia e penalidade por parentesco.

        touros <- data.frame(
          touro = c("T1", "T2", "T3", "T4", "T5"),
          DEP_peso = c(18, 15, 12, 20, 16),
          acuracia = c(0.70, 0.85, 0.60, 0.50, 0.78),
          parentesco_medio = c(0.20, 0.05, 0.02, 0.35, 0.10)
        )

        touros$score <- touros$DEP_peso - 10 * touros$parentesco_medio + 2 * touros$acuracia
        touros$decisao <- ifelse(touros$parentesco_medio > 0.30, "evitar neste lote", "candidato")
        ranking <- touros[order(touros$score, decreasing = TRUE), ]

        print(ranking)
        escolhidos <- subset(ranking, decisao == "candidato")[1:2, ]
        print(escolhidos)
        cat("\nINTERPRETACAO: decisão final combina mérito, confiança e risco de endogamia.\n")

        dir.create("data", showWarnings = FALSE, recursive = TRUE)
        write.csv(ranking, "data/modulo21_simulado.csv", row.names = FALSE)
        cat("Salvo em data/modulo21_simulado.csv\n")
      quiz_questions:
        - text: "Por que maior DEP isolada pode não vencer no projeto final?"
          options: ["Porque parentesco alto ou baixa acurácia podem aumentar risco da decisão.", "Porque DEP nunca deve ser usada.", "Porque acurácia substitui todo fenótipo."]
          correct: 0
        - text: "No índice score = DEP - 10*parentesco + 2*acurácia, o que a penalidade faz?"
          options: ["Reduz prioridade de animais mais aparentados ao lote.", "Aumenta pontuação de parentesco alto.", "Remove necessidade de justificar decisão."]
          correct: 0
        - text: "Qual evidência mínima do projeto final?"
