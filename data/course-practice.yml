    M2:
      formula_terms:
        - "Ponto médio entre homozigotos é referência para avaliar aditividade."
        - "Desvio do heterozigoto em relação ao ponto médio indica dominância."
        - "Epistasia exige comparar combinação de locos, não apenas um genótipo isolado."
      manual_walkthrough:
        - "Com AA = 10 e aa = 4, o ponto médio aditivo é (10 + 4)/2 = 7. Se Aa = 8, heterozigoto está 1 unidade acima do ponto médio."
        - "Esse desvio sugere dominância parcial favorável. Para seleção de longo prazo, efeito aditivo ainda é central porque responde melhor ao acúmulo entre gerações."
      manual_result: "Ponto médio = 7; desvio de dominância em Aa = +1."
      r_preview: |
        valores <- data.frame(genotipo = c("AA","Aa","aa"), valor = c(10,8,4))
        media_homozigotos <- mean(c(10,4))
        valores$desvio <- valores$valor - media_homozigotos
      lab_interpretation: "Aa acima do ponto médio indica dominância; isso não substitui estimativa da fração aditiva."
      decision_prompt: "Explique por que dominância pode favorecer cruzamento, mas aditividade orienta seleção acumulada."
      lab_code: |
        # M2 — Modos de ação gênica
        # Objetivo: comparar aditividade e dominância em valores genotípicos.

        valores <- data.frame(
          genotipo = c("AA", "Aa", "aa"),
          valor = c(10, 8, 4)
        )
        ponto_medio <- mean(valores$valor[valores$genotipo %in% c("AA", "aa")])
        valores$desvio_do_ponto_medio <- valores$valor - ponto_medio
        dominancia_Aa <- valores$desvio_do_ponto_medio[valores$genotipo == "Aa"]

        print(valores)
        cat("\nPonto medio dos homozigotos:", ponto_medio, "\n")
        cat("Desvio de dominancia em Aa:", dominancia_Aa, "\n")
        cat("\nINTERPRETACAO: dominância altera heterozigoto; seleção acumulada depende sobretudo de efeito aditivo.\n")

        dir.create("data", showWarnings = FALSE, recursive = TRUE)
        write.csv(valores, "data/modulo02_simulado.csv", row.names = FALSE)
        cat("Salvo em data/modulo02_simulado.csv\n")
