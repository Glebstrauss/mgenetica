content_collections:
  modules:
    label: Módulos do curso
    route_prefix: modules
    index: modules/index.qmd
    editable_by_app: true
    phases:
      - id: fundamentos
        label: Fundamentos
        modules: [modulo01, modulo02]
      - id: dados-parametros
        label: Dados e parâmetros
        modules: [modulo03, modulo04, modulo05, modulo06]
      - id: modelagem
        label: Modelagem
        modules: [modulo07, modulo08, modulo09]
      - id: genomica
        label: Genômica
        modules: [modulo10, modulo11, modulo12]
    items:
      - id: modulo01
        order: 1
        title: Introdução ao Melhoramento Animal
        phase: Fundamentos
        href: modules/modulo01-introducao-ao-melhoramento-animal.qmd
        script: scripts/modulo01.R
      - id: modulo02
        order: 2
        title: Bases da Genética Quantitativa
        phase: Fundamentos
        href: modules/modulo02-bases-da-genetica-quantitativa.qmd
        script: scripts/modulo02.R
      - id: modulo03
        order: 3
        title: Estatística descritiva e exploração no R
        phase: Dados
        href: modules/modulo03-estatistica-descritiva-e-exploracao-de-dados-no-r.qmd
        script: scripts/modulo03.R
      - id: modulo04
        order: 4
        title: Médias, variâncias e componentes de variância
        phase: Dados
        href: modules/modulo04-medias-variancias-e-componentes-de-variancia.qmd
        script: scripts/modulo04.R
      - id: modulo05
        order: 5
        title: Herdabilidade e repetibilidade
        phase: Parâmetros
        href: modules/modulo05-herdabilidade-e-repetibilidade.qmd
        script: scripts/modulo05.R
      - id: modulo06
        order: 6
        title: Correlações genéticas e fenotípicas
        phase: Parâmetros
        href: modules/modulo06-correlacoes-geneticas-e-fenotipicas.qmd
        script: scripts/modulo06.R
      - id: modulo07
        order: 7
        title: Modelos lineares e modelos mistos
        phase: Modelagem
        href: modules/modulo07-modelos-lineares-e-modelos-mistos.qmd
        script: scripts/modulo07.R
      - id: modulo08
        order: 8
        title: BLUP e avaliação genética
        phase: Modelagem
        href: modules/modulo08-blup-e-avaliacao-genetica.qmd
        script: scripts/modulo08.R
      - id: modulo09
        order: 9
        title: Estrutura de pedigree e parentesco
        phase: Conexão
        href: modules/modulo09-estrutura-de-pedigree-e-parentesco.qmd
        script: scripts/modulo09.R
      - id: modulo10
        order: 10
        title: Genômica e marcadores SNP
        phase: Genômica
        href: modules/modulo10-introducao-a-genomica-e-marcadores-snp.qmd
        script: scripts/modulo10.R
      - id: modulo11
        order: 11
        title: Controle de qualidade genômico
        phase: Genômica
        href: modules/modulo11-controle-de-qualidade-de-dados-genomicos.qmd
        script: scripts/modulo11.R
      - id: modulo12
        order: 12
        title: Matrizes genômicas, GWAS e predição
        phase: Predição
        href: modules/modulo12-matrizes-genomicas-gwas-e-predicao-genomica.qmd
        script: scripts/modulo12.R

design_principles:
  public_site:
    - editorial
    - scientific
