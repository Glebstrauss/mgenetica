      href: semanas/index.qmd
    - id: search
      label: Busca
      href: busca.qmd
    - id: glossary
      label: Glossário
      href: glossario.qmd

content_pages:
  editable_by_app: true
  editorial_patterns:
    - hero
    - page-hero
    - phase-preview
    - module-grid
    - final-cta
  items:
    - id: home
      title: MGenética
      href: index.qmd
      role: public-home
      status: published
      editable_regions:
        - hero
        - entry-points
        - platform-statement
        - phase-preview
        - final-cta
      source_collections:
        - modules
    - id: modules-index
      title: Módulos
      href: modules/index.qmd
      role: collection-index
      status: published
      source_collection: modules
    - id: study-path
      title: Roteiro de estudo
      href: semanas/index.qmd
      role: study-plan
      status: published
    - id: search
      title: Busca
      href: busca.qmd
      role: utility
      status: published
    - id: glossary
      title: Glossário técnico
      href: glossario.qmd
      role: reference
      status: published
    - id: about
      title: Sobre
      href: perfil.qmd
      role: institutional
      status: published

content_collections:
  modules:
    label: Módulos do curso
    route_prefix: modules
    index: modules/index.qmd
    editable_by_app: true
    item_type: learning-module
    default_status: published
    editable_regions:
      - header
      - objectives
      - orientation
      - body
      - exercise
      - quiz
      - navigation
    phases:
      - id: fundamentos
        order: 1
        label: Fundamentos
        summary: Melhoramento animal e bases da genética quantitativa.
        index_summary: Módulos 01-02 apresentam a lógica do melhoramento animal e a decomposição genética do fenótipo.
        modules: [modulo01, modulo02]
      - id: dados-parametros
        order: 2
        label: Dados e parâmetros
        summary: Exploração, variâncias, herdabilidade e correlações.
        index_summary: Módulos 03-06 conectam exploração, variância, herdabilidade, repetibilidade e correlações.
        modules: [modulo03, modulo04, modulo05, modulo06]
      - id: modelagem
        order: 3
        label: Modelagem
        summary: Modelos mistos, BLUP, pedigree e parentesco.
        index_summary: Módulos 07-09 avançam para modelos mistos, BLUP, pedigree e parentesco.
        modules: [modulo07, modulo08, modulo09]
      - id: genomica
        order: 4
        label: Genômica
        summary: SNPs, controle de qualidade, matrizes, GWAS e predição.
        index_summary: Módulos 10-12 introduzem SNPs, controle de qualidade, matrizes genômicas, GWAS e predição.
