site:
  id: mgenetica
  name: MGenética Academy
  role: public-education-site
  management_app_role: internal-admin-panel
  description: Curso aberto de melhoramento animal, genética quantitativa e genômica
    aplicada com R.
  publication_target: github-pages
  content_owner: public-site
governance:
  public_site_role: editorial-institutional-layer
  app_role: internal-management-panel
  canonical_sources:
    navigation: data/site-manifest.yml
    page_registry: data/site-manifest.yml
    module_registry: data/site-manifest.yml
    module_index_cards: data/site-manifest.yml
    longform_content: qmd-pages
    visual_system: styles
  editable_later_by_app:
  - navigation labels and routes
  - page registry and publication status
  - module order, phase, card title and card summary
  - editable regions declared per page or collection
  not_app_managed_in_public_site:
  - rendered Quarto layout chrome
  - scientific longform body without editorial review
  - scripts that generate teaching data
  - visual design tokens without frontend review
  statuses:
  - draft
  - review
  - published
  - archived
