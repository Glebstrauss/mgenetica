content_collections:
  modules:
    label: Blocos temáticos
    route_prefix: modules
    index: modules/index.qmd
    editable_by_app: yes
    item_type: thematic-block
    default_status: published
    editable_regions:
    - header
    - objectives
    - orientation
    - reading-rhythm
    - body
    - exercise
    - evidence-path
    - takeaways
    - quiz
    - after-quiz
    - return-note
    - navigation
    phases:
    - id: fundamentos
      order: 1
      label: 'Módulo 1: Fundamentos'
      summary: Revisão de base genética antes de entrar em populações e genética quantitativa.
      index_summary: 'Módulo 1: Fundamentos organiza 2 blocos temáticos para revisão
        de base genética antes de entrar em populações e genética quantitativa.'
      modules:
      - modulo01
      - modulo02
    - id: populacoes
      order: 2
      label: 'Módulo 2: Genética de populações'
      summary: Frequências, equilíbrio e forças que mudam alelos em rebanhos.
      index_summary: 'Módulo 2: Genética de populações organiza 3 blocos temáticos
        para frequências, equilíbrio e forças que mudam alelos em rebanhos.'
      modules:
      - modulo03
      - modulo04
      - modulo05
    - id: quantitativa
      order: 3
      label: 'Módulo 3: Genética quantitativa'
      summary: Variação contínua, parâmetros, seleção e consequências entre características.
      index_summary: 'Módulo 3: Genética quantitativa organiza 7 blocos temáticos
        para variação contínua, parâmetros, seleção e consequências entre características.'
      modules:
      - modulo06
      - modulo07
      - modulo08
      - modulo09
      - modulo10
      - modulo11
      - modulo12
    - id: avaliacao
      order: 4
      label: 'Módulo 4: Parentesco, cruzamentos e avaliação genética'
      summary: Pedigree, endogamia, cruzamentos, ranking, modelos mistos e BLUP.
      index_summary: 'Módulo 4: Parentesco, cruzamentos e avaliação genética organiza
        5 blocos temáticos para pedigree, endogamia, cruzamentos, ranking, modelos
        mistos e blup.'
      modules:
      - modulo13
      - modulo14
      - modulo15
      - modulo16
      - modulo17
    - id: genomica
      order: 5
      label: 'Módulo 5: Genômica aplicada ao melhoramento'
      summary: Marcadores SNP, controle de qualidade, matriz G, GWAS, predição e projeto
        final.
      index_summary: 'Módulo 5: Genômica aplicada ao melhoramento organiza 4 blocos
        temáticos para marcadores snp, controle de qualidade, matriz g, gwas, predição
        e projeto final.'
      modules:
      - modulo18
      - modulo19
      - modulo20
      - modulo21
